<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- =========================================
         CONFIGURAÇÕES BÁSICAS DA PÁGINA
    ========================================== -->

    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- Faz o site funcionar corretamente em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Alter Ego Web - Giovane</title>

    <!-- Conecta o arquivo CSS ao HTML -->
    <link rel="stylesheet" href="cssdesweb.css">

</head>


<body>

    <!-- =========================================
         CONTAINER PRINCIPAL
    ========================================== -->

    <!-- 
         Essa div agrupa todos os cards da página.
         Ela usa CSS Grid para organizar os elementos.
    -->
    <div class="sc_giovane_container">


        <!-- =========================================
             CARD PRINCIPAL
        ========================================== -->

        <!-- 
             Card principal com:
             - foto
             - nome
             - descrição
        -->
        <div class="sc_giovane_card sc_giovane_card_principal">


            <!-- Foto do usuário -->
            <img 
                id="sc_giovane_foto" 
                src="eu.jpeg" 
                alt="Foto de Giovane"
            >


            <!-- Nome principal -->
            <h1 id="sc_giovane_nome">
                Giovane
            </h1>


            <!-- Descrição principal -->
            <p id="sc_giovane_descricao">

                Sou estudante de desenvolvimento web e gosto de filmes de super-heróis.

            </p>

        </div>


        <!-- =========================================
             CARD DE IDADE
        ========================================== -->
        <div class="sc_giovane_card">

            <!-- Título do card -->
            <h2>Idade</h2>

            <!-- Informação da idade -->
            <p id="sc_giovane_idade">
                26 anos
            </p>

        </div>


        <!-- =========================================
             CARD DO TIME
        ========================================== -->
        <div class="sc_giovane_card">

            <h2>Time do coração</h2>

            <p id="sc_giovane_time">
                Corinthians
            </p>

        </div>


        <!-- =========================================
             CARD DE COMIDA FAVORITA
        ========================================== -->
        <div class="sc_giovane_card">

            <h2>Comida favorita</h2>

            <p id="sc_giovane_comida">
                Churrasco
            </p>

        </div>


        <!-- =========================================
             CARD DE HOBBY
        ========================================== -->
        <div class="sc_giovane_card">

            <h2>Hobby</h2>

            <p id="sc_giovane_hobby">
                Tirar fotos
            </p>

        </div>


        <!-- =========================================
             CARD DE FILME FAVORITO
        ========================================== -->
        <div class="sc_giovane_card">

            <h2>Filme favorito</h2>

            <p id="sc_giovane_filme">
                Constantine
            </p>

        </div>

    </div>


    <!-- =========================================
         BOTÃO DE TRANSFORMAÇÃO
    ========================================== -->

    <!-- 
         Quando o botão for clicado,
         a função sc_giovane_transformar()
         será executada no JavaScript.
    -->
    <button 
        id="sc_giovane_btn_transformar" 
        onclick="sc_giovane_transformar()"
    >

        Transformar!

    </button>


    <!-- =========================================
         IMPORTAÇÃO DO JAVASCRIPT
    ========================================== -->

    <!-- Conecta o arquivo JavaScript ao HTML -->
    <script src="provadesweb.js"></script>

</body>
</html>
